<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cyber-Voxel Nusantara — Rank Renderer</title>
<style>
  :root{
    --neon:#39ff6a;
    --bg:#020805;
    --panel:rgba(4,20,10,.78);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--bg); color:#cfeed8; overflow:hidden;
    font-family:"Courier New",ui-monospace,monospace;
    -webkit-font-smoothing:antialiased;
  }
  #scene{position:fixed; inset:0; display:block}
  .hud{position:fixed; pointer-events:none; z-index:10}

  #title{top:18px; left:20px}
  #title h1{
    margin:0; font-size:17px; letter-spacing:.22em; color:var(--neon);
    text-shadow:0 0 12px rgba(57,255,106,.55);
  }
  #title p{margin:6px 0 0; font-size:11px; letter-spacing:.14em; color:#5f9d74}

  #info{
    top:18px; right:20px; width:236px; padding:13px 15px;
    background:var(--panel); border:1px solid rgba(57,255,106,.35);
    border-radius:4px; box-shadow:inset 0 0 18px rgba(57,255,106,.1);
  }
  #info .k{font-size:10px; letter-spacing:.2em; color:#4f8a63}
  #info .rank{font-size:11px; letter-spacing:.18em; color:var(--neon); margin-top:2px}
  #info .name{font-size:16px; letter-spacing:.08em; color:#eafff0; margin:4px 0 8px}
  #info .desc{font-size:11px; line-height:1.6; color:#96c7a7}
  #info .bar{margin-top:12px}
  #info .bar span{display:block; font-size:10px; letter-spacing:.18em; color:#4f8a63; margin-bottom:5px}
  #info .track{height:9px; background:#08190f; border:1px solid rgba(57,255,106,.3); display:flex; gap:2px; padding:2px}
  #info .track i{flex:1; background:#0e2a18}
  #info .track i.on{background:var(--neon); box-shadow:0 0 6px rgba(57,255,106,.8)}

  #dock{
    bottom:14px; left:0; right:0; display:flex; flex-direction:column;
    align-items:center; gap:9px;
  }
  #bar{
    display:flex; gap:7px; pointer-events:auto; flex-wrap:wrap; justify-content:center;
    max-width:calc(100vw - 28px);
  }
  button{
    font:inherit; font-size:11px; letter-spacing:.12em; color:#9fd9b3; cursor:pointer;
    background:rgba(4,20,10,.85); border:1px solid rgba(57,255,106,.28);
    padding:8px 11px; border-radius:3px; transition:.16s;
  }
  button:hover{color:#eafff0; border-color:var(--neon); box-shadow:0 0 12px rgba(57,255,106,.28)}
  button.active{color:#031008; background:var(--neon); border-color:var(--neon)}

  #hint{font-size:10px; letter-spacing:.16em; color:#437a56; text-align:center; padding:0 14px}

  /* light HUD, paired with the STUDIO preset */
  body.studio{color:#2c2e2b}
  body.studio #title h1{color:#16301f; text-shadow:none}
  body.studio #title p{color:#5d6b60}
  body.studio #info{background:rgba(255,255,255,.84); border-color:rgba(30,60,40,.22); box-shadow:none}
  body.studio #info .k, body.studio #info .bar span{color:#6d7a70}
  body.studio #info .rank{color:#1c6b3a}
  body.studio #info .name{color:#14140f}
  body.studio #info .desc{color:#4a544c}
  body.studio #info .track{background:#e7e9e4; border-color:rgba(30,60,40,.25)}
  body.studio #info .track i{background:#d3d7d0}
  body.studio #info .track i.on{background:#1fa855; box-shadow:none}
  body.studio #hint{color:#7d8a80}
  body.studio button{background:rgba(255,255,255,.86); border-color:rgba(30,60,40,.25); color:#3c4a40}
  body.studio button:hover{color:#14140f; border-color:#1fa855; box-shadow:none}
  body.studio button.active{background:#1fa855; border-color:#1fa855; color:#fff}

  #loader{
    position:fixed; inset:0; display:grid; place-items:center; z-index:50;
    background:var(--bg); color:var(--neon); font-size:12px; letter-spacing:.28em;
    transition:opacity .6s; text-align:center; padding:20px;
  }
  #loader.gone{opacity:0; pointer-events:none}
  @media (max-width:760px){
    #info{display:none}
    #title h1{font-size:13px}
    button{padding:7px 8px; font-size:10px}
    #hint{display:none}
  }
</style>
</head>
<body>

<canvas id="scene"></canvas>

<div class="hud" id="title">
  <h1>CYBER-VOXEL NUSANTARA</h1>
  <p>RANK PROGRESSION // ADAB ENGINE v1.0</p>
</div>

<div class="hud" id="info">
  <div class="k">CURRENT STATUS</div>
  <div class="rank" id="i-rank">OVERVIEW</div>
  <div class="name" id="i-name">5 Pangkat Adab</div>
  <div class="desc" id="i-desc">&nbsp;</div>
  <div class="bar">
    <span id="i-barlabel">NUR AMANAH</span>
    <div class="track" id="i-track"></div>
  </div>
</div>

<div class="hud" id="dock">
  <div id="hint">DRAG = ORBIT &nbsp;•&nbsp; SCROLL = ZOOM &nbsp;•&nbsp; CLICK CHARACTER = FOCUS &nbsp;•&nbsp; 1-5 = JUMP &nbsp;•&nbsp; ESC = RESET</div>
  <div id="bar">
    <button id="btn-all" class="active">OVERVIEW</button>
  </div>
</div>

<div id="loader">MEMUATKAN VOXEL&hellip;</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
/* =====================================================================
   CYBER-VOXEL NUSANTARA — voxel character renderer  (Three.js r128)

   Five ranked characters, each assembled from BoxGeometry voxels in
   four passes: bare body -> clothing shell (slightly larger boxes) ->
   headwear -> neon armour plates and circuitry. Stature rises with
   rank. Emissive materials plus additive glow sprites stand in for
   post-process bloom, so the whole scene stays at a few thousand
   triangles with no shadow maps.
   ===================================================================== */

const NEON      = 0x39ff6a;   // UI / grid / ground rings
const NEON_BODY = 0x4dff52;   // character circuitry — sampled off the concept art,
const NEON_SOFT = 0xb6ffa8;   // whose neon sits a little yellower than the HUD green
const BG        = 0x020805;

/* ---------------------------------------------------------------------
   1. Body metrics
   One unit ~= one voxel; a character stands ~37 units tall including the
   haircut. Every y is absolute (0 = ground) so parts can be authored
   independently and then re-parented onto animated pivots.

   The narrow torso, large head and long legs come from the concept art:
   measured there, shoulder span is only about 1.28x the head width and
   the head is 0.278 of total height. Classic Minecraft proportions sit
   near 2.1 and 0.20, which read far stockier than the art does. The leg
   ratio could not be measured -- the sarung hides the gap between the
   legs -- so legs are matched to the art by eye at a little under half
   the total height.
   ------------------------------------------------------------------ */
const P = {
  footW:3.3, footH:1.7, footD:4.6, footZ:0.6, footY:0.85,
  shinW:2.6, shinH:7.4, shinD:2.6, shinY:5.2,
  thighW:3.0, thighH:8.0, thighD:3.0, thighY:12.9,
  pelvisW:6.6, pelvisH:2.7, pelvisD:3.8, pelvisY:18.25,
  torsoW:6.6, torsoH:7.4, torsoD:3.8, torsoY:23.3,
  neckW:2.6, neckH:1.4, neckD:2.6, neckY:27.7,
  headW:8.0, headH:8.0, headD:8.0, headY:32.4,
  uArmW:2.2, uArmH:6.0, uArmD:2.4, uArmY:24.0,
  lArmW:2.0, lArmH:5.4, lArmD:2.2, lArmY:18.3,
  handW:2.9, handH:2.6, handD:3.0, handY:14.4,
  legX:1.75, armX:4.75, shoulderY:27.0
};
const PAD     = 0.5;    // how far clothing sits outside the body
const SPACING = 20;     // distance between characters

/* ---------------------------------------------------------------------
   2. Character definitions
   circuit: 0 none, 1 subtle (rank 4), 2 full (rank 5)

   `scale` and the fabric colours are traced off the concept lineup: each
   figure's ground-to-forehead height was measured in pixels (a landmark
   that ignores headwear, so the tanijak doesn't inflate the ratio) and
   normalised to rank 4, giving 0.77 / 0.88 / 0.92 / 1.00 / 1.18. Cloth
   tones come from averaging the lit faces of each garment in the art.
   ------------------------------------------------------------------ */
const CHARS = [
  {
    buttons:0xf0c02a, rank:1, short:'Dagang', name:'Anak Dagang', title:'Pedagang Muda', amanah:24,
    desc:'Baju melayu kain kasar, samping putih, berkaki selipar. Belum ada nur — adab masih di peringkat niat.',
    scale:0.77, pose:'clasped',
    skin:0xf0aa6d, hair:0x222221,
    shirt:0xa85c22, shirtTrim:0xc4762f, collar:null,
    sarung:0xe5dcc9, sarungLong:true, pants:0x6f4523, sandals:true, pockets:false,
    headwear:'none', prop:null, pack:false, circuit:0, glow:0
  },
  {
    buttons:null, rank:2, short:'Perantau', name:'Perantau', title:'Pengembara Ilmu', amanah:45,
    desc:'Baju biru perantau, seluar jean gelap, beg sandar penuh catatan. Mula mengumpul ilmu di luar kampung.',
    scale:0.88, pose:'rest',
    skin:0xf0aa6d, hair:0x222221,
    shirt:0x1a8798, shirtTrim:0x38b3c4, collar:null,
    sarung:null, sarungLong:false, pants:0x2b3a52, sandals:true, pockets:true,
    headwear:'none', prop:null, pack:true, circuit:0, glow:0
  },
  {
    buttons:0x6ddb3a, rank:3, short:'Pendekar', name:'Pendekar Muda', title:'Murid Gelanggang', amanah:63,
    desc:'Baju melayu hitam, songkok, samping berpetak. Memegang kayu latihan — silat bermula dengan hormat.',
    scale:0.92, pose:'rest',
    skin:0xf0aa6d, hair:0x222221,
    shirt:0x1d2022, shirtTrim:0x2f4036, collar:null,
    sarung:'check', sarungLong:true, pants:0x111416, sandals:true, pockets:false,
    headwear:'songkok', prop:'stick', pack:false, circuit:0, glow:0
  },
  {
    buttons:null, rank:4, short:'Pahlawan', name:'Pahlawan Siber', title:'Panglima Siber', amanah:84,
    desc:'Litar neon halus menyala pada baju, plat nur di tali pinggang dan but. Tanijak hitam berdenyut perlahan, keris siber di tangan.',
    scale:1.00, pose:'rest',
    skin:0xf0aa6d, hair:0x222221,
    shirt:0x0e1312, shirtTrim:0x18221d, collar:0xe9eef0,
    sarung:0x0c100f, sarungLong:false, pants:0x0a0d0c, sandals:false, pockets:false,
    headwear:'tanijak', prop:'keris', pack:false, circuit:1, glow:0.5
  },
  {
    buttons:null, rank:5, short:'Adiguru', name:'Adiguru', title:'Guru Silat • Al-Amin', amanah:98,
    desc:'Litar nur penuh menyala di seluruh tubuh. Tanijak Dendam Tak Sudah bercahaya dengan zarah nur, keris nur di tangan.',
    scale:1.18, pose:'rest',
    skin:0xf0aa6d, hair:0x222221,
    shirt:0x080c0a, shirtTrim:0x0e1712, collar:null,
    sarung:0x080c0a, sarungLong:false, pants:0x060908, sandals:false, pockets:false,
    headwear:'tanijak-elite', prop:'keris-elite', pack:false, circuit:2, glow:1
  }
];

/* emissive strength per circuit level: [base, pulse amount] */
const EMIT = {
  1: {trace:0.26, plate:0.34, blade:0.58, crown:0.30, amt:0.16},
  2: {trace:0.85, plate:0.82, blade:1.10, crown:0.95, amt:0.32}
};

/* ---------------------------------------------------------------------
   3. Renderer / scene / camera
   ------------------------------------------------------------------ */
const canvas   = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({canvas:canvas, antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(BG, 1);

const scene = new THREE.Scene();
scene.background = new THREE.Color(BG);
scene.fog = new THREE.Fog(BG, 120, 340);

const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.5, 900);
const HOME = {pos:new THREE.Vector3(8, 31, 98), tgt:new THREE.Vector3(8, 21, 0)};
camera.position.copy(HOME.pos);

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.target.copy(HOME.tgt);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 18;
controls.maxDistance = 220;
controls.maxPolarAngle = Math.PI * 0.495;
controls.autoRotateSpeed = 1.1;

/* ---------------------------------------------------------------------
   4. Shared helpers: textures, materials, boxes, sprites
   ------------------------------------------------------------------ */

/* Voxel scale. BEVEL is the chamfer cut from every cube edge; CELL is how
   wide one painted voxel cell is in world units. Both are absolute, so a
   hand and a torso carry the same cube size. */
const BEVEL  = 0.22;
const CELL   = 1.05;
const TILE   = 4;                // cells per texture tile
const TILE_W = CELL * TILE;

/**
 * A tile of voxel cells, each shaded like a slightly inflated cube: bright
 * at the centre, falling off to a darker rim, with a crisp seam between
 * cells. Together with the geometry chamfer this is what reads as "made of
 * many small cubes" rather than "one big box with lines drawn on it".
 *
 * Values stay at or below full brightness because a multiply map can darken
 * but never lift past the material colour.
 */
function voxelTile(){
  const cells = TILE, px = 40, s = cells * px;
  const c = document.createElement('canvas');
  c.width = c.height = s;
  const g = c.getContext('2d');
  for (let y=0;y<cells;y++){
    for (let x=0;x<cells;x++){
      const cx = x*px + px/2, cy = y*px + px/2;
      const tint = 1 - Math.random()*0.05;                   // per-cell variation
      const lvl = function(v){ return Math.round(v * tint); };
      const grd = g.createRadialGradient(cx, cy, px*0.08, cx, cy, px*0.78);
      grd.addColorStop(0.00, 'rgb(255,255,255)');
      grd.addColorStop(0.55, 'rgb('+lvl(246)+','+lvl(246)+','+lvl(246)+')');
      grd.addColorStop(1.00, 'rgb('+lvl(207)+','+lvl(207)+','+lvl(207)+')');
      g.fillStyle = grd;
      g.fillRect(x*px, y*px, px, px);
      g.fillStyle = 'rgba(0,0,0,.10)';                       // seam
      g.fillRect(x*px, (y+1)*px - 2, px, 2);
      g.fillRect((x+1)*px - 2, y*px, 2, px);
    }
  }
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.anisotropy = 4;
  return t;
}

// Woven check for the rank-3 samping.
function checkTexture(){
  const s = 48, c = document.createElement('canvas');
  c.width = c.height = s;
  const g = c.getContext('2d');
  g.fillStyle = '#dedbd4'; g.fillRect(0,0,s,s);
  g.fillStyle = '#35373a';
  for (let y=0;y<s;y+=8) for (let x=0;x<s;x+=8)
    if (((x/8)+(y/8)) % 2 === 0) g.fillRect(x,y,8,8);
  g.fillStyle = 'rgba(0,0,0,.28)';
  for (let x=0;x<s;x+=8){ g.fillRect(x,0,1,s); g.fillRect(0,x,s,1); }
  const t = new THREE.CanvasTexture(c);
  t.magFilter = t.minFilter = THREE.NearestFilter;
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(0.7, 0.7);   // ~1-unit check squares against the world UVs
  return t;
}

// Radial falloff sprite — a cheap stand-in for post-process bloom.
function glowTexture(){
  const s = 128, c = document.createElement('canvas');
  c.width = c.height = s;
  const g = c.getContext('2d');
  const grd = g.createRadialGradient(s/2, s/2, 0, s/2, s/2, s/2);
  grd.addColorStop(0.00, 'rgba(170,255,200,.9)');
  grd.addColorStop(0.25, 'rgba(57,255,106,.4)');
  grd.addColorStop(0.60, 'rgba(57,255,106,.1)');
  grd.addColorStop(1.00, 'rgba(57,255,106,0)');
  g.fillStyle = grd; g.fillRect(0,0,s,s);
  return new THREE.CanvasTexture(c);
}

// Soft elliptical contact shadow, for the white studio preset.
function shadowTexture(){
  const s = 128, c = document.createElement('canvas');
  c.width = c.height = s;
  const g = c.getContext('2d');
  const grd = g.createRadialGradient(s/2, s/2, 0, s/2, s/2, s/2);
  grd.addColorStop(0.00, 'rgba(0,0,0,.55)');
  grd.addColorStop(0.45, 'rgba(0,0,0,.22)');
  grd.addColorStop(1.00, 'rgba(0,0,0,0)');
  g.fillStyle = grd; g.fillRect(0,0,s,s);
  return new THREE.CanvasTexture(c);
}

const TEX = {vox:voxelTile(), check:checkTexture(), glow:glowTexture(),
             shadow:shadowTexture()};
/* ---------------------------------------------------------------------
   Chamfered voxel geometry
   The concept art's cubes have their edges cut, not squared off, and that
   chamfer is what keeps the model from reading as a stack of hard boxes.
   A scaled unit cube cannot carry it -- scaling a baked bevel stretches it
   into a wedge -- so each distinct size gets its own geometry, cached, with
   a constant-width chamfer.

   UVs are the world position projected onto the face's dominant axis and
   divided by the tile's world size, so one voxel cell stays the same size
   on a hand and on a torso with no per-part texture repeat to manage.
   ------------------------------------------------------------------ */
const geoCache = {};

function chamferBox(w, h, d, faceGroup){
  const key = w.toFixed(2)+'|'+h.toFixed(2)+'|'+d.toFixed(2)+(faceGroup ? '|f' : '');
  if (geoCache[key]) return geoCache[key];

  const X = w/2, Y = h/2, Z = d/2;
  const b = Math.min(BEVEL, X*0.45, Y*0.45, Z*0.45);
  const E = [X, Y, Z];

  // One of the three axes runs to full extent; the other two pull in by b.
  function vert(full, sx, sy, sz){
    const sg = [sx, sy, sz];
    return [0,1,2].map(function(a){ return (a === full ? E[a] : E[a] - b) * sg[a]; });
  }

  const tris = [];       // {v:[p0,p1,p2], face:0|1|2|null, sign}
  function push(p0, p1, p2, face, sign){
    tris.push({v:[p0, p1, p2], face:face, sign:sign});
  }

  // 6 main faces, each a quad inset by b on its two in-plane axes
  for (let a=0; a<3; a++){
    for (let sgn=-1; sgn<=1; sgn+=2){
      const o = [(a+1)%3, (a+2)%3];
      const corner = function(i, j){
        const sg = [0,0,0];
        sg[a] = sgn; sg[o[0]] = i; sg[o[1]] = j;
        return vert(a, sg[0], sg[1], sg[2]);
      };
      const q = [corner(-1,-1), corner(1,-1), corner(1,1), corner(-1,1)];
      push(q[0], q[1], q[2], a, sgn);
      push(q[0], q[2], q[3], a, sgn);
    }
  }

  // 12 chamfer quads, one per cube edge
  for (let a=0; a<3; a++){
    for (let bx=a+1; bx<3; bx++){
      const other = 3 - a - bx;
      for (let sa=-1; sa<=1; sa+=2){
        for (let sb=-1; sb<=1; sb+=2){
          const mk = function(full, so){
            const sg = [0,0,0];
            sg[a] = sa; sg[bx] = sb; sg[other] = so;
            return vert(full, sg[0], sg[1], sg[2]);
          };
          const A1 = mk(a, -1),  A2 = mk(a, 1);
          const B1 = mk(bx, -1), B2 = mk(bx, 1);
          push(A1, A2, B2, null);
          push(A1, B2, B1, null);
        }
      }
    }
  }

  // 8 corner triangles
  for (let sx=-1; sx<=1; sx+=2)
    for (let sy=-1; sy<=1; sy+=2)
      for (let sz=-1; sz<=1; sz+=2)
        push(vert(0,sx,sy,sz), vert(1,sx,sy,sz), vert(2,sx,sy,sz), null);

  // The head needs its front face on a second material, so those two
  // triangles are moved to the end and given their own group.
  const isFront = function(t){ return faceGroup && t.face === 2 && t.sign === 1; };
  const ordered = tris.filter(function(t){ return !isFront(t); })
                      .concat(tris.filter(isFront));

  const pos = [], nor = [], uv = [];
  ordered.forEach(function(t){
    const p = t.v;
    // outward normal: the shape is convex and centred, so the centroid
    // direction settles the winding
    let n = [
      (p[1][1]-p[0][1])*(p[2][2]-p[0][2]) - (p[1][2]-p[0][2])*(p[2][1]-p[0][1]),
      (p[1][2]-p[0][2])*(p[2][0]-p[0][0]) - (p[1][0]-p[0][0])*(p[2][2]-p[0][2]),
      (p[1][0]-p[0][0])*(p[2][1]-p[0][1]) - (p[1][1]-p[0][1])*(p[2][0]-p[0][0])
    ];
    const cen = [0,1,2].map(function(i){ return (p[0][i]+p[1][i]+p[2][i])/3; });
    const order = (n[0]*cen[0] + n[1]*cen[1] + n[2]*cen[2]) < 0 ? [0,2,1] : [0,1,2];
    if (order[1] === 2){ n = [-n[0], -n[1], -n[2]]; }
    const len = Math.hypot(n[0], n[1], n[2]) || 1;
    n = [n[0]/len, n[1]/len, n[2]/len];

    // dominant axis of the normal picks the projection plane for UVs
    const ax = Math.abs(n[0]) >= Math.abs(n[1]) && Math.abs(n[0]) >= Math.abs(n[2]) ? 0
             : Math.abs(n[1]) >= Math.abs(n[2]) ? 1 : 2;
    const front = isFront(t);
    order.forEach(function(k){
      const q = p[k];
      pos.push(q[0], q[1], q[2]);
      nor.push(n[0], n[1], n[2]);
      if (front){                       // 0..1 across the face, for the portrait
        uv.push((q[0] + X) / w, (q[1] + Y) / h);
      } else if (ax === 0){
        uv.push(q[2] / TILE_W, q[1] / TILE_W);
      } else if (ax === 1){
        uv.push(q[0] / TILE_W, q[2] / TILE_W);
      } else {
        uv.push(q[0] / TILE_W, q[1] / TILE_W);
      }
    });
  });

  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('normal',   new THREE.Float32BufferAttribute(nor, 3));
  g.setAttribute('uv',       new THREE.Float32BufferAttribute(uv, 2));
  if (faceGroup){
    const n = ordered.length * 3;
    g.addGroup(0, n - 6, 0);
    g.addGroup(n - 6, 6, 1);
  }
  geoCache[key] = g;
  return g;
}

/**
 * The face, drawn onto the head's +z face. In the concept art each eye is an
 * L -- a horizontal brow bar with a short descender on its inner edge -- and
 * the smile is a smooth curve. Neither is buildable from boxes, which is why
 * earlier passes read blank and blocky next to the art.
 */
function faceTexture(skinHex){
  const cell = 24, n = 16, s = cell * n;       // a 16x16 voxel face
  const c = document.createElement('canvas');
  c.width = c.height = s;
  const g = c.getContext('2d');

  g.fillStyle = '#' + ('000000' + skinHex.toString(16)).slice(-6);
  g.fillRect(0, 0, s, s);
  for (let y=0;y<n;y++) for (let x=0;x<n;x++){     // same beveled cells as elsewhere
    g.fillStyle = 'rgba(255,255,255,' + (0.05 + Math.random()*0.05).toFixed(3) + ')';
    g.fillRect(x*cell, y*cell, cell, 2);
    g.fillRect(x*cell, y*cell, 2, cell);
    g.fillStyle = 'rgba(0,0,0,.05)';
    g.fillRect(x*cell, (y+1)*cell - 2, cell, 2);
  }

  const px = function(x, y, w, h){ g.fillRect(x*cell, y*cell, w*cell, h*cell); };
  g.fillStyle = '#171310';
  px(2.5, 5, 4, 1.1);   px(5.4, 5, 1.1, 3.2);     // left brow + inner descender
  px(9.4, 5, 4, 1.1);   px(9.4, 5, 1.1, 3.2);     // right, mirrored

  g.strokeStyle = '#6b4033';                       // the smile, one smooth stroke
  g.lineWidth = cell * 0.42;
  g.lineCap = 'round';
  g.beginPath();
  g.moveTo(5.9*cell, 10.4*cell);
  g.quadraticCurveTo(8*cell, 12.0*cell, 10.1*cell, 10.4*cell);
  g.stroke();

  const t = new THREE.CanvasTexture(c);
  t.anisotropy = 4;
  return t;
}

/**
 * Phong rather than Lambert. The concept art reads as Roblox shapes with a
 * modern game render over them, and the modern half is largely a soft sheen
 * plus edge light -- flat diffuse shading is what made the voxels look like
 * matte toy bricks. Cloth gets a dim, broad highlight; metal and neon trim
 * take a tighter one.
 */
function mat(color, opts){
  opts = opts || {};
  const shine = opts.shine || 'cloth';
  const spec = shine === 'hard' ? 0x5d6b5f : shine === 'soft' ? 0x14170f : 0x22271f;
  return new THREE.MeshPhongMaterial({
    color: color,
    map: opts.map === null ? null : (opts.map || TEX.vox),
    specular: spec,
    shininess: shine === 'hard' ? 34 : shine === 'soft' ? 5 : 11,
    emissive: opts.emissive !== undefined ? opts.emissive : 0x000000,
    emissiveIntensity: opts.ei !== undefined ? opts.ei : 1
  });
}

// A glowing trace material, registered so it can breathe in the loop.
function traceMat(c, level, kind){
  const e = EMIT[level];
  const base = e[kind];
  const m = mat(level === 2 ? 0x0b2c15 : 0x0a1a0f,
                {emissive:NEON_BODY, ei:base, map:null, shine:'hard'});
  c.pulse.push({m:m, base:base, amt:e.amt});
  return m;
}

/**
 * Add one voxel box. o: w,h,d dimensions, x,y,z centre, material|color,
 * rx,ry,rz optional rotation.
 */
function box(parent, o){
  const m = new THREE.Mesh(chamferBox(o.w, o.h, o.d, Array.isArray(o.material)),
                           o.material || mat(o.color, o));
  m.position.set(o.x || 0, o.y || 0, o.z || 0);
  if (o.rx) m.rotation.x = o.rx;
  if (o.ry) m.rotation.y = o.ry;
  if (o.rz) m.rotation.z = o.rz;
  parent.add(m);
  return m;
}

function glowSprite(parent, o){
  const s = new THREE.Sprite(new THREE.SpriteMaterial({
    map: TEX.glow, color: o.color || NEON, transparent:true,
    blending: THREE.AdditiveBlending, depthWrite:false,
    opacity: o.opacity !== undefined ? o.opacity : 0.6
  }));
  s.position.set(o.x||0, o.y||0, o.z||0);
  s.scale.set(o.size, o.sizeY || o.size, 1);
  parent.add(s);
  return s;
}

/**
 * Floor label: "RANK n" over the character name. The dark scene gets a
 * neon plate; the studio preset gets plain type on a hairline rule, the
 * way the concept sheet captions its lineup.
 */
function labelTexture(rank, name, title, light){
  const w = 512, h = 176, c = document.createElement('canvas');
  c.width = w; c.height = h;
  const g = c.getContext('2d');
  g.textAlign = 'center';

  if (light){
    g.fillStyle = '#f2f1ed';
    g.fillRect(0, 20, w, h - 34);
    g.fillStyle = '#3d3d3a';
    g.font = 'bold 30px "Helvetica Neue", Arial, sans-serif';
    g.fillText('RANK ' + rank, w/2, 62);
    g.strokeStyle = '#9a9a95';
    g.lineWidth = 2;
    g.beginPath(); g.moveTo(90, 82); g.lineTo(w-90, 82); g.stroke();
    g.fillStyle = '#14140f';
    g.font = 'bold 44px "Helvetica Neue", Arial, sans-serif';
    g.fillText(name.toUpperCase(), w/2, 128);
    g.fillStyle = '#6f6f68';
    g.font = '20px "Helvetica Neue", Arial, sans-serif';
    g.fillText(title.toUpperCase(), w/2, 158);
  } else {
    g.fillStyle = 'rgba(3,16,8,.62)';
    g.fillRect(6, 26, w-12, h-52);
    g.strokeStyle = 'rgba(57,255,106,.6)';
    g.lineWidth = 3;
    g.strokeRect(6, 26, w-12, h-52);
    g.fillStyle = '#7dffa6';
    g.font = 'bold 32px "Courier New", monospace';
    g.fillText('RANK ' + rank, w/2, 72);
    g.fillStyle = '#eafff0';
    g.font = 'bold 42px "Courier New", monospace';
    g.fillText(name.toUpperCase(), w/2, 119);
    g.fillStyle = '#79bd8f';
    g.font = 'bold 20px "Courier New", monospace';
    g.fillText(title.toUpperCase(), w/2, 146);
  }
  return new THREE.CanvasTexture(c);
}

/* ---------------------------------------------------------------------
   5. Neon circuitry
   Traces are authored in face-local 2D (u across, v up) then extruded as
   thin boxes just outside the clothing surface, so they hug the voxels.
   ------------------------------------------------------------------ */
let seed = 20260912;
function rnd(){ seed = (seed*1664525 + 1013904223) % 4294967296; return seed / 4294967296; }

const FACES = {
  front: {n: 1, u:'x', k:'d'},
  back:  {n:-1, u:'x', k:'d'},
  right: {n: 1, u:'z', k:'w'},
  left:  {n:-1, u:'z', k:'w'}
};

/**
 * Stamp a songket-style neon motif onto the surface of a box region.
 * The concept art's glow reads as woven ornament rather than PCB routing,
 * so this lays a slim centre stem with diamond beads (boxes rolled 45
 * degrees about the face normal) and optional chevron wings, the way a
 * songket panel repeats down a garment.
 *
 * @param b   {w,h,d,x,y,z} of the host box (the clothing layer)
 * @param cfg {mat, count, thick, faces, wings}
 */
function addMotif(parent, b, cfg){
  const t     = cfg.thick || 0.22;
  const lift  = 0.06;
  const faces = cfg.faces || ['front','back','left','right'];

  faces.forEach(function(fname){
    const f      = FACES[fname];
    const alongX = f.u === 'x';
    const half   = (f.k === 'd' ? b.d : b.w) / 2 + lift;
    const uSpan  = alongX ? b.w : b.d;

    // Place one motif box. `rot` spins it within the face plane, which is
    // a Z rotation on the front/back faces and an X rotation on the sides.
    function put(u, v, uLen, vLen, rot){
      const o = {material:cfg.mat, h:vLen, x:b.x, y:b.y + v, z:b.z};
      if (alongX){ o.w = uLen; o.d = t*0.5; o.x += u; o.z = b.z + f.n * half; o.rz = rot || 0; }
      else       { o.d = uLen; o.w = t*0.5; o.z += u; o.x = b.x + f.n * half; o.rx = rot || 0; }
      box(parent, o);
    }

    const n    = cfg.count;
    const step = b.h / (n + 1);
    const off  = (rnd() - 0.5) * uSpan * 0.22;   // nudge the panel off dead centre
    put(off, 0, t*0.6, b.h*0.86);                // centre stem
    for (let i=0;i<n;i++){
      const v = -b.h/2 + step*(i+1);
      put(off, v, t*2.4, t*2.4, Math.PI/4);      // diamond bead
      if (cfg.wings){
        const span = Math.min(uSpan*0.30, t*5.5);
        [-1,1].forEach(function(d){
          put(off + d*span*0.6, v + step*0.24, span, t*0.6, d*0.5);
          put(off + d*span*1.1, v + step*0.48, t*1.3, t*1.3, Math.PI/4);
        });
      }
    }
  });
}

function buildSongkok(parent){
  const felt = mat(0x13150f);
  box(parent, {w:P.headW+0.5, h:2.6, d:P.headD+0.5, y:P.headY + P.headH/2 + 1.1, material:felt});
  box(parent, {w:P.headW+0.15,h:0.45,d:P.headD+0.15,y:P.headY + P.headH/2 + 2.6, material:felt});
  box(parent, {w:P.headW+0.62,h:0.4, d:P.headD+0.62,y:P.headY + P.headH/2 + 0.2, material:mat(0x212517)});
}

/**
 * Tanijak / tengkolok: a compact folded crown with two upswept horns —
 * the tall "Dendam Tak Sudah" point on the wearer's left and a shorter
 * counter-fold on the right, with a glowing emblem on the front fold.
 */
function buildTanijak(parent, c, elite){
  const lvl   = elite ? 2 : 1;
  const cloth = mat(elite ? 0x0a1310 : 0x0d1311);
  const trace = traceMat(c, lvl, 'crown');
  const base  = P.headY + P.headH/2;

  // low band, then the folded body of the cloth
  box(parent, {w:P.headW+0.8, h:1.9, d:P.headD+0.8, y:base + 0.85, material:cloth});
  box(parent, {w:P.headW+0.9, h:0.26,d:P.headD+0.9, y:base + 1.70, material:trace});
  box(parent, {w:P.headW+0.5, h:2.0, d:P.headD+0.5, y:base + 2.70, material:cloth});
  const capTop = base + 3.70;

  // front fold carrying the circuit emblem
  box(parent, {w:5.0, h:1.8, d:0.7, y:base + 2.6, z:P.headD/2 + 0.42, rx:0.16, material:cloth});
  box(parent, {w:1.5, h:1.5, d:0.3, y:base + 2.6, z:P.headD/2 + 0.80, rx:0.16, rz:0.79, material:trace});
  box(parent, {w:3.9, h:0.22,d:0.3, y:base + 1.85,z:P.headD/2 + 0.78, rx:0.16, material:trace});

  /* The upswept folds. Each is a plate hinged at a point on the cap's top
     face, so the geometry rises out of the crown instead of hovering over
     it: offset the centre by half its length along the rotated axis. */
  function foldPlate(o){
    const half = o.h / 2;
    const x = o.ax - half * Math.sin(o.rz);
    const y = capTop - 1.15 + half * Math.cos(o.rz);
    box(parent, {w:o.w, h:o.h, d:o.d, x:x, y:y, rz:o.rz, material:cloth});
    box(parent, {w:o.w*0.16, h:o.h*0.78, d:0.3, x:x, y:y, z:o.d/2 + 0.1,
                 rz:o.rz, material:trace});
    box(parent, {w:o.w*0.86, h:0.24, d:o.d*0.9,
                 x:x + half * 0.92 * -Math.sin(o.rz),
                 y:y + half * 0.92 *  Math.cos(o.rz),
                 rz:o.rz, material:trace});
  }
  // the tall "Dendam Tak Sudah" point, then its shorter counter-fold
  foldPlate({w:4.4, h: elite ? 4.2 : 3.5, d:3.8, ax:-0.8, rz: 0.66});
  foldPlate({w:3.3, h: elite ? 2.7 : 2.3, d:3.2, ax: 2.0, rz:-0.78});

  if (elite){
    // nur motes orbiting the crown
    const spark = mat(0x2a7a33, {emissive:NEON_SOFT, ei:0.85, map:null});
    c.pulse.push({m:spark, base:0.85, amt:0.5});
    const sg = new THREE.Group();
    sg.position.y = base + 6.4;
    for (let i=0;i<9;i++){
      const m = box(sg, {w:0.32, h:0.32, d:0.32, material:spark});
      m.userData.r = 3.4 + (i % 3) * 1.1;
      m.userData.y = ((i * 7) % 5) * 1.1 - 1.6;
      m.userData.a = i * 0.7;
    }
    parent.add(sg);
    c.sparks = sg;
    c.glows.push(glowSprite(parent, {y:base + 5.4, size:15, opacity:0.42}));
    c.glows.push(glowSprite(parent, {y:base + 2.2, size:13, opacity:0.24}));
  } else {
    c.glows.push(glowSprite(parent, {y:base + 3.4, size:9, opacity:0.18}));
  }
}

// Short rattan training baton, held across the hip with a bound grip.
function buildStick(parent){
  const g = new THREE.Group();
  box(g, {w:1.1,  h:7.6, d:1.1,  color:0x8a5f39});
  box(g, {w:1.35, h:1.2, d:1.35, y:-3.5, color:0x64432a});
  box(g, {w:1.25, h:1.0, d:1.25, y: 1.6, color:0x3c6b44});
  box(g, {w:1.2,  h:0.5, d:1.2,  y: 3.2, color:0x9c7248});
  g.rotation.z = 0.3;
  g.rotation.x = -0.34;
  parent.add(g);
  return g;
}

// Keris: wavy blade (lok) from overlapping tapered segments, with a
// brighter inner core so it reads white-hot at the centre like the art.
function buildKeris(parent, c, elite){
  const g     = new THREE.Group();
  const lvl   = elite ? 2 : 1;
  const hilt  = mat(elite ? 0x123021 : 0x1b1f1d);
  const blade = traceMat(c, lvl, 'blade');
  const core  = mat(elite ? 0x9dffa0 : 0x336b34, {emissive:NEON_SOFT, ei: elite ? 1.5 : 0.6, map:null});
  c.pulse.push({m:core, base: elite ? 1.5 : 0.6, amt: EMIT[lvl].amt});

  box(g, {w:1.5, h:3.3, d:1.5, y:-1.9, rz:0.2, material:hilt});          // hulu
  box(g, {w:1.8, h:1.0, d:1.8, y:-3.8, material:hilt});
  box(g, {w:4.2, h:1.0, d:2.2, y: 0.5, material: elite ? blade : hilt}); // ganja

  const segs = 8;
  for (let i=0;i<segs;i++){
    const t = i/(segs-1);
    const w = 2.0 - t*1.45;
    const x = Math.sin(i*0.85) * 0.3;
    const y = 1.7 + i*1.3;
    const rz = Math.sin(i*0.85) * 0.07;
    box(g, {w:w, h:1.5, d:0.7 - t*0.28, x:x, y:y, rz:rz, material:blade});
    box(g, {w:w*0.34, h:1.5, d:0.8 - t*0.3, x:x, y:y, rz:rz, material:core});
  }
  box(g, {w:0.5, h:1.6, d:0.34, y:1.7 + segs*1.3, material:core});       // tip

  c.glows.push(glowSprite(g, {y:6.5, size: elite ? 9 : 5, sizeY: elite ? 19 : 13,
                              opacity: elite ? 0.5 : 0.2}));
  g.rotation.z = -0.24;
  g.rotation.x = -0.14;
  parent.add(g);
  return g;
}

function buildPack(parent){
  const shell = mat(0x14181c);
  const strap = mat(0x1b5d76);
  const zBack = -(P.torsoD/2 + 1.9);
  box(parent, {w:5.6, h:7.4, d:3.0, y:P.torsoY + 0.2, z:zBack, material:shell});
  box(parent, {w:5.8, h:1.5, d:3.2, y:P.torsoY + 3.5, z:zBack, material:strap});
  box(parent, {w:3.9, h:2.4, d:0.9, y:P.torsoY - 1.5, z:zBack - 1.7, material:mat(0x1c2227)});
  box(parent, {w:1.2, h:3.3, d:0.7, y:P.torsoY + 5.0, z:zBack - 0.5, material:mat(0xd8c48a)});
  [-1,1].forEach(function(s){   // shoulder straps coming over the front
    box(parent, {w:0.8, h:8.7, d:0.7, x:s*2.3, y:P.torsoY, z:P.torsoD/2 + PAD/2 + 0.25, material:strap});
  });
}

/**
 * The haircut, as a grid of small cubes rather than a few slabs. The art's
 * hair is a fine voxel mass with individual cubes stepping out of the
 * silhouette, and that detail is much of what separates it from a blocky
 * model, so it earns the extra boxes.
 */
function addHair(head, hair, full){
  const hz = P.headD/2, hx = P.headW/2;
  const cell = (P.headW + 0.4) / 4;           // ~2.1 units: the art's cubes are chunky

  box(head, {w:P.headW+0.24, h:P.headH*0.74, d:1.1, y:0.5, z:-(hz + 0.3), material:hair});
  if (!full){   // under headwear only the nape and sideburns show
    box(head, {w:P.headW+0.24, h:0.9, d:P.headD+0.24, y:P.headH/2 - 0.3, material:hair});
    [-1,1].forEach(function(s){
      box(head, {w:0.5, h:2.2, d:P.headD+0.2, x:s*(hx + 0.36), y:P.headH/2 - 1.9, material:hair});
    });
    return;
  }

  // crown: 6x5 columns of varying height, so the top edge steps irregularly
  const HEIGHT = [
    [1,2,2,1],
    [1,2,2,2],
    [1,1,2,1],
    [1,1,1,1]
  ];
  for (let r=0;r<HEIGHT.length;r++){
    for (let q=0;q<HEIGHT[r].length;q++){
      const h = 0.7 + HEIGHT[r][q] * 0.72;
      box(head, {w:cell + 0.1, h:h, d:cell + 0.1,
                 x:(q - 1.5) * cell, y:P.headH/2 - 0.3 + h/2, z:(1.5 - r) * cell - 0.3,
                 material:hair});
    }
  }
  // fringe over the forehead, dropping lower at the temples
  [-1.5,-0.5,0.5,1.5].forEach(function(q, i){
    const drop = (i === 0 || i === 3) ? 2.4 : 1.1;
    box(head, {w:cell + 0.1, h:drop, d:1.1,
               x:q * cell, y:P.headH/2 - drop/2 + 0.1, z:hz + 0.1, material:hair});
  });
  [-1,1].forEach(function(s){   // sideburns
    box(head, {w:0.55, h:2.8, d:P.headD+0.2, x:s*(hx + 0.38), y:P.headH/2 - 2.0, material:hair});
  });
}

function buildCharacter(cfg){
  const c = {
    cfg:  cfg,
    slot: new THREE.Group(),   // fixed frame: pad, ring, label, lamp
    body: new THREE.Group(),   // animated: bobs and sways
    pulse: [],                 // emissive materials that breathe
    glows: []                  // additive sprites that breathe
  };
  c.slot.add(c.body);
  c.body.scale.setScalar(cfg.scale);   // rank reads in stature first

  const lvl   = cfg.circuit;
  const skin  = mat(cfg.skin);
  const hair  = mat(cfg.hair);
  const shirt = mat(cfg.shirt);
  const trim  = mat(cfg.shirtTrim);
  const pants = mat(cfg.pants);
  const sarungMat = cfg.sarung === 'check' ? mat(0xffffff, {map:TEX.check})
                  : cfg.sarung === null ? null : mat(cfg.sarung);
  const circuits  = lvl ? traceMat(c, lvl, 'trace') : null;
  const plate     = lvl ? traceMat(c, lvl, 'plate') : null;

  /* ---- legs, feet and footwear (mirrored) ---- */
  [-1, 1].forEach(function(s){
    const x = s * P.legX;
    box(c.body, {w:P.shinW, h:P.shinH, d:P.shinD, x:x, y:P.shinY, material:skin});
    box(c.body, {w:P.thighW, h:P.thighH, d:P.thighD, x:x, y:P.thighY, material:skin});
    box(c.body, {w:P.shinW+PAD, h:P.shinH+0.2, d:P.shinD+PAD, x:x, y:P.shinY+0.3, material:pants});
    box(c.body, {w:P.thighW+PAD, h:P.thighH, d:P.thighD+PAD, x:x, y:P.thighY, material:pants});
    if (cfg.pockets){
      box(c.body, {w:0.35, h:2.4, d:2.0, x:x + s*(P.thighW+PAD)/2, y:P.thighY+1.4, material:trim});
    }
    if (cfg.sandals){
      // bare foot on a wooden sole with a toe strap
      box(c.body, {w:P.footW, h:1.1, d:P.footD, x:x, y:1.05, z:P.footZ, material:skin});
      box(c.body, {w:P.footW+0.4, h:0.55, d:P.footD+0.4, x:x, y:0.28, z:P.footZ,
                   material:mat(0xdcae74)});
      box(c.body, {w:P.footW+0.4, h:0.4,  d:1.1, x:x, y:1.35, z:P.footZ - 1.5,
                   material:mat(0xb98452)});
    } else {
      // armoured boot with a glowing toe cap and shin guard
      box(c.body, {w:P.footW+0.6, h:P.footH+0.8, d:P.footD+0.5, x:x, y:P.footY+0.4, z:P.footZ,
                   material:mat(0x0a0e0c)});
      box(c.body, {w:P.footW+0.5, h:0.5, d:1.5, x:x, y:P.footY+1.3, z:P.footZ + 1.4, material:plate});
      box(c.body, {w:P.shinW+PAD+0.4, h:1.1, d:P.shinD+PAD+0.4, x:x, y:P.shinY-1.9, material:mat(0x0a0e0c)});
      box(c.body, {w:1.5, h:1.5, d:0.5, x:x, y:P.shinY+1.2, z:(P.shinD+PAD)/2 + 0.2, material:plate});
    }
  });

  /* ---- core ---- */
  box(c.body, {w:P.pelvisW, h:P.pelvisH, d:P.pelvisD, y:P.pelvisY, material:skin});
  box(c.body, {w:P.torsoW,  h:P.torsoH,  d:P.torsoD,  y:P.torsoY,  material:skin});
  box(c.body, {w:P.neckW,   h:P.neckH,   d:P.neckD,   y:P.neckY,   material:skin});

  /* ---- head (own pivot so it can glance around) ---- */
  const head = new THREE.Group();
  head.position.y = P.headY;
  c.body.add(head);
  c.head = head;

  // chamferBox puts the +z face in group 1, so the portrait rides there alone
  const faceMat = new THREE.MeshPhongMaterial({color:0xffffff, map:faceTexture(cfg.skin),
                                               specular:0x22271f, shininess:11});
  box(head, {w:P.headW, h:P.headH, d:P.headD, material:[skin, faceMat]});
  [-1,1].forEach(function(s){   // ears stand proud of the head, as in the art
    box(head, {w:0.5, h:2.0, d:1.5, x:s*(P.headW/2 + 0.22), y:-0.2, z:-0.3, material:skin});
  });
  addHair(head, hair, cfg.headwear === 'none');

  /* ---- arms: one pivot group per side, hinged at the shoulder ---- */
  c.arms = [];
  [-1, 1].forEach(function(s){
    const arm = new THREE.Group();
    arm.position.set(s * P.armX, P.shoulderY, 0);
    // resting pose: hands clasped in front for the youngest rank
    arm.userData.baseX = cfg.pose === 'clasped' ? -0.42 : 0;
    arm.userData.baseZ = (cfg.pose === 'clasped' ? 0.20 : 0.03) * -s;
    c.body.add(arm);
    c.arms.push(arm);
    const rel = function(y){ return y - P.shoulderY; };

    box(arm, {w:P.uArmW, h:P.uArmH, d:P.uArmD, y:rel(P.uArmY), material:skin});
    box(arm, {w:P.lArmW, h:P.lArmH, d:P.lArmD, y:rel(P.lArmY), material:skin});
    box(arm, {w:P.handW, h:P.handH, d:P.handD, y:rel(P.handY), material:skin});

    // sleeve of the baju melayu
    box(arm, {w:P.uArmW+PAD, h:P.uArmH+0.3, d:P.uArmD+PAD, y:rel(P.uArmY)-0.1, material:shirt});
    box(arm, {w:P.lArmW+PAD, h:P.lArmH,     d:P.lArmD+PAD, y:rel(P.lArmY),     material:shirt});
    box(arm, {w:P.lArmW+PAD+0.2, h:0.5, d:P.lArmD+PAD+0.2, y:rel(P.lArmY) - P.lArmH/2, material:trim});

    if (lvl){
      // gauntlet, cuff band, upper-arm ring and shoulder plate
      box(arm, {w:P.handW+0.3, h:P.handH+0.3, d:P.handD+0.3, y:rel(P.handY), material:mat(0x0b100d)});
      box(arm, {w:P.handW+0.4, h:0.42, d:P.handD+0.4, y:rel(P.handY) + P.handH/2, material:plate});
      box(arm, {w:P.lArmW+PAD+0.3, h:0.6, d:P.lArmD+PAD+0.3, y:rel(P.lArmY) + 1.9, material:plate});
      box(arm, {w:P.uArmW+PAD+0.35, h:0.6, d:P.uArmD+PAD+0.35, y:rel(P.uArmY) + 2.6,
                material: lvl === 2 ? plate : mat(0x131c17)});
      addMotif(arm, {w:P.uArmW+PAD, h:P.uArmH, d:P.uArmD+PAD, x:0, y:rel(P.uArmY), z:0},
               {mat:circuits, count: lvl === 2 ? 2 : 1, thick:0.18,
                faces: lvl === 2 ? ['front','right','left'] : ['front']});
      addMotif(arm, {w:P.lArmW+PAD, h:P.lArmH, d:P.lArmD+PAD, x:0, y:rel(P.lArmY), z:0},
               {mat:circuits, count:1, thick:0.18, faces:['front']});
    }
  });

  /* ---- baju melayu (torso layer) ---- */
  box(c.body, {w:P.torsoW+PAD, h:P.torsoH+0.4, d:P.torsoD+PAD, y:P.torsoY-0.1, material:shirt});
  box(c.body, {w:P.torsoW+PAD+0.2, h:1.0, d:P.torsoD+PAD+0.2, y:P.torsoY - P.torsoH/2 - 0.2, material:trim});
  if (cfg.collar){   // white shirt showing at the neckline
    box(c.body, {w:2.6, h:1.1, d:0.5, y:P.torsoY + P.torsoH/2 - 0.25,
                 z:P.torsoD/2 + PAD/2 - 0.1, material:mat(cfg.collar)});
  }
  box(c.body, {w:3.7, h:1.2, d:P.neckD+1.6, y:P.torsoY + P.torsoH/2 + 0.4, material:trim});   // collar
  // front opening: a glowing placket on the powered ranks
  const placketZ = P.torsoD/2 + PAD/2 + 0.12;
  box(c.body, {w:0.9, h:P.torsoH*0.76, d:0.35, y:P.torsoY + 0.4,
               z:placketZ, material: lvl ? plate : trim});
  if (cfg.buttons){
    const btn = mat(cfg.buttons);
    [1.5, 0.25].forEach(function(dy){
      box(c.body, {w:0.6, h:0.6, d:0.3, y:P.torsoY + dy, z:placketZ + 0.22, material:btn});
    });
  }
  [-1,1].forEach(function(s){   // pesak side panels + shoulder seam
    box(c.body, {w:0.45, h:P.torsoH+0.4, d:P.torsoD+PAD+0.05, x:s*(P.torsoW+PAD)/2, y:P.torsoY-0.1, material:trim});
    box(c.body, {w:1.2, h:0.6, d:P.torsoD+PAD, x:s*(P.torsoW/2 + 0.75), y:P.torsoY + P.torsoH/2, material:trim});
  });

  /* ---- sarung / samping: knee length on the barefoot ranks ---- */
  const sarungH = cfg.sarungLong ? 9.4 : 5.4;
  const sarungY = P.pelvisY + P.pelvisH/2 - sarungH/2;
  if (sarungMat){
    box(c.body, {w:P.pelvisW+PAD+0.7, h:sarungH, d:P.pelvisD+PAD+0.7, y:sarungY, material:sarungMat});
    box(c.body, {w:P.pelvisW+PAD+0.9, h:0.5, d:P.pelvisD+PAD+0.9,
                 y:sarungY - sarungH/2 + 0.2, material: cfg.sarung === 'check' ? sarungMat : trim});
  }
  const beltY = P.pelvisY + P.pelvisH/2 - 0.35;
  box(c.body, {w:P.pelvisW+PAD+1.0, h: lvl ? 0.8 : 1.1, d:P.pelvisD+PAD+1.0, y:beltY,
               material: lvl ? plate : trim});
  if (lvl){   // centre buckle with two smaller side blocks, as in the art
    [[0, 1.9, 1.5], [-2.2, 0.95, 0.8], [2.2, 0.95, 0.8]].forEach(function(b){
      box(c.body, {w:b[1], h:b[2], d:0.6, x:b[0], y:beltY,
                   z:(P.pelvisD+PAD+1.0)/2 + 0.2, material:plate});
    });
  }

  /* ---- circuitry across torso and thighs ---- */
  if (lvl){
    addMotif(c.body, {w:P.torsoW+PAD, h:P.torsoH+0.4, d:P.torsoD+PAD, x:0, y:P.torsoY-0.1, z:0},
             {mat:circuits, count: lvl === 2 ? 3 : 2, thick:0.22, wings:true});
    [-1,1].forEach(function(s){
      addMotif(c.body, {w:P.thighW+PAD, h:P.thighH, d:P.thighD+PAD, x:s*P.legX, y:P.thighY, z:0},
               {mat:circuits, count:2, thick:0.18, faces: s > 0 ? ['front','right'] : ['front','left']});
      // thigh plate
      box(c.body, {w:P.thighW+PAD+0.3, h:0.7, d:P.thighD+PAD+0.3, x:s*P.legX, y:P.thighY - 2.5,
                   material:plate});
    });
    box(c.body, {w:1.6, h:1.6, d:0.5, y:P.torsoY + 2.5, z:P.torsoD/2 + PAD/2 + 0.16, material:plate});
    if (lvl === 2){
      c.glows.push(glowSprite(c.body, {y:P.torsoY, size:22, opacity:0.24}));
      c.glows.push(glowSprite(c.body, {y:8,        size:18, opacity:0.15}));
    } else {
      c.glows.push(glowSprite(c.body, {y:P.torsoY, size:14, opacity:0.1}));
    }
  }

  /* ---- headwear ---- */
  if      (cfg.headwear === 'songkok')       buildSongkok(c.body);
  else if (cfg.headwear === 'tanijak')       buildTanijak(c.body, c, false);
  else if (cfg.headwear === 'tanijak-elite') buildTanijak(c.body, c, true);

  /* ---- pack & props (props ride the right arm so they sway with it) ---- */
  if (cfg.pack) buildPack(c.body);
  const rightArm = c.arms[1];
  if (cfg.prop === 'stick'){
    buildStick(rightArm).position.set(1.3, P.handY - P.shoulderY + 0.2, 2.1);
  } else if (cfg.prop === 'keris' || cfg.prop === 'keris-elite'){
    buildKeris(rightArm, c, cfg.prop === 'keris-elite')
      .position.set(1.8, P.handY - P.shoulderY + 0.4, 2.3);
  }

  /* ---- ground pad, ring, shadow and label (not scaled or bobbed) ---- */
  const pad = new THREE.Mesh(
    new THREE.CircleGeometry(7.6, 32),
    new THREE.MeshBasicMaterial({color: cfg.glow ? NEON : 0x1c6e38, transparent:true,
                                 opacity: cfg.glow ? 0.13 : 0.07, depthWrite:false})
  );
  pad.rotation.x = -Math.PI/2;
  pad.position.y = 0.04;
  c.slot.add(pad);
  c.pad = pad;

  const shade = new THREE.Mesh(
    new THREE.PlaneGeometry(17 * cfg.scale, 10 * cfg.scale),
    new THREE.MeshBasicMaterial({map:TEX.shadow, transparent:true, depthWrite:false, opacity:0.85})
  );
  shade.rotation.x = -Math.PI/2;
  shade.position.set(0, 0.03, 1.4);
  shade.visible = false;
  c.slot.add(shade);
  c.shadow = shade;

  c.ringBase = 0.16 + 0.3*cfg.glow;
  const ring = new THREE.Mesh(
    new THREE.RingGeometry(7.4, 8.0, 40),
    new THREE.MeshBasicMaterial({color:NEON, transparent:true, opacity:c.ringBase, depthWrite:false})
  );
  ring.rotation.x = -Math.PI/2;
  ring.position.y = 0.05;
  c.slot.add(ring);
  c.ring = ring;

  c.labelTex = {dark:  labelTexture(cfg.rank, cfg.name, cfg.title, false),
                light: labelTexture(cfg.rank, cfg.name, cfg.title, true)};
  c.label = new THREE.Sprite(new THREE.SpriteMaterial({
    map:c.labelTex.dark, transparent:true, depthWrite:false
  }));
  c.label.scale.set(13.5, 4.6, 1);
  c.label.position.set(0, 2.2, 9.6);
  c.slot.add(c.label);

  /* ---- invisible click target ---- */
  const picker = new THREE.Mesh(new THREE.BoxGeometry(16, 48, 16),
    new THREE.MeshBasicMaterial({transparent:true, opacity:0, depthWrite:false}));
  picker.position.y = 23;
  picker.userData.char = c;
  c.slot.add(picker);
  c.picker = picker;

  /* ---- point light above the character ---- */
  const lamp = new THREE.PointLight(0xb6ffcf, 0.8 + cfg.glow*0.45, 78, 2);
  lamp.position.set(0, 46, 12);
  c.slot.add(lamp);
  c.lamp = lamp;
  c.lampBase0 = lamp.intensity;   // unscaled; the theme switch dims it
  c.lampBase = lamp.intensity;

  return c;
}

const chars = [];

CHARS.forEach(function(cfg, i){
  const c = buildCharacter(cfg);
  c.index = i;
  c.x = (i - (CHARS.length-1)/2) * SPACING;
  c.slot.position.x = c.x;
  c.phase = i * 0.8;
  scene.add(c.slot);
  chars.push(c);

});

/* ---------------------------------------------------------------------
   9b. Presentation presets
   SIBER is the neon scene; STUDIO reproduces the concept sheet's white
   product shot -- soft key light, contact shadows, plain captions, and
   none of the additive glow, which would be invisible on white anyway.
   ------------------------------------------------------------------ */
const THEMES = {
  siber: {
    bg:0x020805, floor:0x04170b, fogNear:120, fogFar:340,
    ambC:0x2e3630, ambI:0.68, hemiSky:0x477055, hemiGround:0x05130b, hemiI:0.38,
    keyI:0.92, rimI:0.26, rim2I:0.26, sideI:0.16, lampMul:1,
    grid:true, motes:true, pads:true, glows:true, shadows:false, label:'dark'
  },
  studio: {
    bg:0xf2f1ed, floor:null, fogNear:280, fogFar:900,
    ambC:0xe4e6e2, ambI:0.34, hemiSky:0xffffff, hemiGround:0xb8bcb6, hemiI:0.26,
    keyI:0.46, rimI:0.14, rim2I:0.16, sideI:0.1, lampMul:0.12,
    grid:false, motes:false, pads:false, glows:false, shadows:true, label:'light'
  }
};
let themeName = 'siber';
let btnTheme = null;

function applyTheme(name){
  themeName = name;
  const T = THEMES[name];
  scene.background.setHex(T.bg);
  scene.fog.color.setHex(T.bg);
  scene.fog.near = T.fogNear;
  scene.fog.far  = T.fogFar;
  renderer.setClearColor(T.bg, 1);
  floor.visible = T.floor !== null;
  if (T.floor !== null) floor.material.color.setHex(T.floor);
  amb.color.setHex(T.ambC);       amb.intensity  = T.ambI;
  hemi.color.setHex(T.hemiSky);   hemi.intensity = T.hemiI;
  hemi.groundColor.setHex(T.hemiGround);
  key.intensity  = T.keyI;
  rim.intensity  = T.rimI;
  rim2.intensity = T.rim2I;
  side.intensity = T.sideI;
  grid.visible = T.grid;
  moteCloud.visible = T.motes;
  chars.forEach(function(c){
    c.pad.visible = T.pads;
    c.ring.visible = T.pads;
    c.shadow.visible = T.shadows;
    c.glows.forEach(function(g){ g.visible = T.glows; });
    c.lampBase = c.lampBase0 * T.lampMul;
    c.label.material.map = c.labelTex[T.label];
    c.label.material.needsUpdate = true;
  });
  document.body.classList.toggle('studio', name === 'studio');
  if (btnTheme) btnTheme.textContent = name === 'siber' ? 'MOD: SIBER' : 'MOD: STUDIO';
}

/* ---------------------------------------------------------------------
   10. Focus / camera transitions
   ------------------------------------------------------------------ */
let focused = null;
let moving  = false;
const desired = {pos:HOME.pos.clone(), tgt:HOME.tgt.clone()};

function focusChar(c){
  focused = c;
  const s = c.cfg.scale;
  desired.pos.set(c.x + 7*s, 4 + 25*s, 8 + 60*s);
  desired.tgt.set(c.x, 2 + 19*s, 0);
  startMove();
}
function focusHome(){
  focused = null;
  desired.pos.copy(HOME.pos);
  desired.tgt.copy(HOME.tgt);
  startMove();
}
function startMove(){
  moving = true;
  controls.enabled = false;
  controls.autoRotate = false;
  updatePanel(focused);
  syncButtons();
}

const raycaster = new THREE.Raycaster();
const ndc = new THREE.Vector2();
let downAt = null;

renderer.domElement.addEventListener('pointerdown', function(e){
  downAt = {x:e.clientX, y:e.clientY};
  controls.autoRotate = false;               // hand control back to the user
});
renderer.domElement.addEventListener('pointerup', function(e){
  if (!downAt) return;
  const moved = Math.hypot(e.clientX - downAt.x, e.clientY - downAt.y);
  downAt = null;
  if (moved > 6){                            // that was an orbit drag
    if (focused && !moving) controls.autoRotate = true;
    return;
  }
  ndc.x =  (e.clientX / innerWidth)  * 2 - 1;
  ndc.y = -(e.clientY / innerHeight) * 2 + 1;
  raycaster.setFromCamera(ndc, camera);
  const hit = raycaster.intersectObjects(pickers, false)[0];
  if (hit)           focusChar(hit.object.userData.char);
  else if (focused)  focusHome();
  else if (!moving)  controls.autoRotate = false;
});
addEventListener('keydown', function(e){
  if (e.key === 'Escape') focusHome();
  if (e.key >= '1' && e.key <= '5') focusChar(chars[+e.key - 1]);
  if (e.key === 't' || e.key === 'T') applyTheme(themeName === 'siber' ? 'studio' : 'siber');
});

/* ---------------------------------------------------------------------
   11. HUD
   ------------------------------------------------------------------ */
const trackEl = document.getElementById('i-track');
for (let i=0;i<20;i++) trackEl.appendChild(document.createElement('i'));

function updatePanel(c){
  const cells = trackEl.children;
  let amanah;
  if (c){
    document.getElementById('i-rank').textContent = 'RANK ' + c.cfg.rank + ' // ' + c.cfg.title.toUpperCase();
    document.getElementById('i-name').textContent = c.cfg.name;
    document.getElementById('i-desc').textContent = c.cfg.desc;
    amanah = c.cfg.amanah;
    document.getElementById('i-barlabel').textContent = 'NUR AMANAH ' + amanah + '/100';
  } else {
    document.getElementById('i-rank').textContent = 'OVERVIEW';
    document.getElementById('i-name').textContent = '5 Pangkat Adab';
    document.getElementById('i-desc').textContent =
      'Klik mana-mana karakter untuk zum dan berputar. Drag untuk orbit, scroll untuk zum, ESC untuk kembali.';
    amanah = 0;
    document.getElementById('i-barlabel').textContent = 'NUR AMANAH';
  }
  const on = Math.round(amanah / 5);
  for (let i=0;i<cells.length;i++) cells[i].className = i < on ? 'on' : '';
}

const bar    = document.getElementById('bar');
const btnAll = document.getElementById('btn-all');
btnAll.addEventListener('click', focusHome);
const rankBtns = chars.map(function(c){
  const b = document.createElement('button');
  b.textContent = 'R' + c.cfg.rank + ' ' + c.cfg.short.toUpperCase();
  b.addEventListener('click', function(){ focusChar(c); });
  bar.appendChild(b);
  return b;
});
btnTheme = document.createElement('button');
btnTheme.id = 'btn-theme';
btnTheme.textContent = 'MOD: SIBER';
btnTheme.addEventListener('click', function(){
  applyTheme(themeName === 'siber' ? 'studio' : 'siber');
});
bar.appendChild(btnTheme);

function syncButtons(){
  btnAll.classList.toggle('active', !focused);
  rankBtns.forEach(function(b, i){ b.classList.toggle('active', focused === chars[i]); });
}
updatePanel(null);
applyTheme('siber');

/* ---------------------------------------------------------------------
   12. Animation loop
   ------------------------------------------------------------------ */
const clock = new THREE.Clock();

function animate(){
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();

  /* ease the camera into the focused / home pose */
  if (moving){
    camera.position.lerp(desired.pos, 0.07);
    controls.target.lerp(desired.tgt, 0.07);
    if (camera.position.distanceTo(desired.pos) < 0.4 &&
        controls.target.distanceTo(desired.tgt) < 0.2){
      camera.position.copy(desired.pos);
      controls.target.copy(desired.tgt);
      moving = false;
      controls.enabled = true;
      controls.autoRotate = !!focused;   // orbit the character once parked
    }
  }

  chars.forEach(function(c){
    const ph = c.phase;

    /* idle float */
    c.body.position.y = Math.sin(t*1.25 + ph) * 0.38;
    c.body.rotation.y = Math.sin(t*0.35 + ph) * 0.06;

    /* breathing arms, glancing head */
    c.arms.forEach(function(arm, i){
      const flip = i ? Math.PI : 0;
      arm.rotation.x = arm.userData.baseX + Math.sin(t*1.25 + ph + flip) * 0.05;
      arm.rotation.z = arm.userData.baseZ + Math.sin(t*0.9 + ph) * 0.02 * (i ? -1 : 1);
    });
    c.head.rotation.y = Math.sin(t*0.45 + ph) * 0.13;
    c.head.rotation.x = Math.sin(t*0.6  + ph) * 0.03;

    /* neon pulse — strong on rank 5, a faint shimmer on rank 4 */
    if (c.pulse.length){
      const w = Math.sin(t * (c.cfg.circuit === 2 ? 2.3 : 1.1) + ph);
      c.pulse.forEach(function(p){
        p.m.emissiveIntensity = Math.max(0, p.base * (1 + p.amt * w));
      });
      const k = 1 + (c.cfg.circuit === 2 ? 0.3 : 0.1) * w;
      c.glows.forEach(function(g){
        if (g.userData.base === undefined){
          g.userData.base = g.material.opacity;
          g.userData.sx = g.scale.x;
          g.userData.sy = g.scale.y;
        }
        g.material.opacity = g.userData.base * k;
        g.scale.set(g.userData.sx * k, g.userData.sy * k, 1);
      });
      c.ring.material.opacity = c.ringBase * (1 + 0.35*w);
    }

    /* nur motes orbit the Adiguru's crown */
    if (c.sparks){
      c.sparks.children.forEach(function(m){
        const a = t*0.55 + m.userData.a;
        m.position.set(Math.cos(a) * m.userData.r,
                       m.userData.y + Math.sin(t*1.5 + m.userData.a) * 0.7,
                       Math.sin(a) * m.userData.r);
      });
    }

    /* dim the rest of the cast so the selected rank reads clearly */
    const want = (!focused || focused === c) ? 1 : 0.3;
    c.lamp.intensity += (c.lampBase * want - c.lamp.intensity) * 0.08;
    c.label.material.opacity += (want - c.label.material.opacity) * 0.08;
  });

  /* drifting motes */
  const pos = moteGeo.attributes.position.array;
  for (let i=0;i<MOTES;i++){
    pos[i*3+1] -= 0.035 + (i%7)*0.004;
    if (pos[i*3+1] < 0) pos[i*3+1] = 85;
  }
  moteGeo.attributes.position.needsUpdate = true;
  grid.material.opacity = 0.24 + Math.sin(t*0.8)*0.05;

  controls.update();
  renderer.render(scene, camera);
}

addEventListener('resize', function(){
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

animate();
setTimeout(function(){ document.getElementById('loader').classList.add('gone'); }, 350);

/* debug handle */
window.NUSUKI = {scene:scene, camera:camera, controls:controls, chars:chars,
                 renderer:renderer, focusChar:focusChar, focusHome:focusHome};
</script>
</body>
</html>
